# Dependabot version updates. Security updates are enabled in the repository
# settings and run regardless of this file; this file adds the routine version
# bumps. Most open alerts (sharp, undici, zod, ip-address, brace-expansion)
# are pinned by a direct dependency such as wrangler or vite, so the
# security-only jobs report update_not_possible until that parent moves.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
