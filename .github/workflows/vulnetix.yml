name: Vulnetix Security

on:
  push:
  # A release cut from a tag that already existed produces no push event, so
  # the tag-push trigger above does not cover it.
  release:
    types: [published]
  workflow_dispatch:

env:
  VULNETIX_VERSION: latest

jobs:
  # A repository that has not been given the Vulnetix secrets yet is not broken;
  # it simply has nowhere to publish. Without this gate every job in the matrix
  # fails on "missing ApiKey or org for noninteractive login", so the repository
  # carries a permanent red X on every push that names no secret and tells
  # nobody what to do about it.
  #
  # The check is its own job because `secrets` is not available in a job-level
  # `if:`; an output from a job that CAN read them is.
  preflight:
    name: Credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
          VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
        run: |
          if [ -n "${VULNETIX_ORG_ID:-}" ] && [ -n "${VULNETIX_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VULNETIX_ORG_ID and VULNETIX_API_KEY are not set for this repository, so the scan was skipped. Add both as repository secrets."
          fi

  analyze:
    name: ${{ matrix.name }}
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sca
            name: SCA
            run: vulnetix sca --no-banner --no-progress --verbose
            artifact: .vulnetix/sbom.cdx.json
          - id: secrets
            name: Secrets
            run: vulnetix secrets --ignore-binaries --ignore-git --no-banner --no-progress --verbose
            artifact: .vulnetix/sast.sarif
          - id: licenses
            name: Licenses
            run: vulnetix license --no-banner --no-progress --verbose
            artifact: .vulnetix/sbom.cdx.json
          - id: cbom
            name: CBOM
            run: vulnetix cbom --no-banner --no-progress --verbose
            artifact: .vulnetix/cbom.cdx.json
          - id: aibom
            name: AIBOM
            run: vulnetix aibom --commit-scan-max 1 --no-banner --no-progress --verbose
            artifact: .vulnetix/ai-bom.cdx.json

    steps:
      - uses: actions/checkout@v5

      - name: Install Vulnetix CLI
        run: |
          curl -fsSL https://cli.vulnetix.com/install.sh | sh -s -- --install-dir "$HOME/.local/bin" --version "$VULNETIX_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate with Vulnetix
        run: vulnetix auth login --noninteractive --store project --no-banner --no-progress --verbose

      - name: Verify Vulnetix authentication
        run: vulnetix auth verify --no-banner --no-progress --verbose

      - name: Run ${{ matrix.name }}
        continue-on-error: true
        run: |
          ${{ matrix.run }}

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: read
      actions: read
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Vulnetix CLI
        run: |
          curl -fsSL https://cli.vulnetix.com/install.sh | sh -s -- --install-dir "$HOME/.local/bin" --version "$VULNETIX_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate with Vulnetix
        run: vulnetix auth login --noninteractive --store project --no-banner --no-progress --verbose

      - name: Upload all artifacts to Vulnetix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vulnetix gha upload --org-id "$VULNETIX_ORG_ID" --json --no-banner --no-progress --verbose

  publish-tea:
    name: TEA
    needs: [preflight, analyze]
    # `needs` alone would skip this whenever any one of the scanner legs fails
    # or is cancelled. The design publishes whatever evidence exists, so a
    # partial scan must still publish. `!cancelled()` still stops it when the
    # whole run is cancelled.
    #
    # The preflight condition is separate and not optional: `!cancelled()` is
    # true when `analyze` was SKIPPED for want of credentials, so without it
    # this job would run against a repository that has none and fail on exactly
    # the error the preflight exists to report cleanly.
    if: ${{ !cancelled() && needs.preflight.outputs.configured == 'true' }}
    uses: Vulnetix/cli/.github/workflows/tea-release.yml@tea-release-v1
    with:
      visibility: public
    secrets: inherit
